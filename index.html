<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잠자는 뇌 깨우기! 순발력 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', 'Pretendard', sans-serif; }
        
        /* 타겟(농구공) 호버 및 클릭 액션 효과 */
        .target-anim {
            transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .target-anim:active {
            transform: scale(0.85);
        }
        
        /* 팝업 등장 애니메이션 */
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-2xl rounded-3xl shadow-xl overflow-hidden flex flex-col relative">
        
        <!-- 헤더 영역 -->
        <div class="bg-indigo-600 p-6 text-center text-white">
            <h1 class="text-3xl font-extrabold mb-2 tracking-tight">🧠 잠자는 뇌 깨우기!</h1>
            <p class="text-indigo-200 text-sm md:text-base">화면에 나타나는 농구공 🏀을 최대한 빨리 <strong>5번</strong> 클릭하세요!</p>
        </div>

        <!-- 상태창 영역 (클릭 수, 타이머) -->
        <div class="flex justify-between items-center px-8 py-4 bg-gray-50 border-b border-gray-100">
            <div class="text-lg font-semibold text-gray-600">
                목표: <span id="clicks-display" class="text-indigo-600 font-bold text-2xl">0</span> <span class="text-sm">/ 5</span>
            </div>
            <div class="text-lg font-semibold text-gray-600">
                시간: <span id="timer-display" class="text-emerald-500 font-bold text-2xl">0.00</span> <span class="text-sm">초</span>
            </div>
        </div>

        <!-- 게임 보드 영역 -->
        <div id="game-board" class="w-full h-[400px] relative bg-gray-50 cursor-crosshair touch-none">
            
            <!-- 게임 시작 전 안내 메시지 -->
            <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-white bg-opacity-90 z-10 transition-opacity duration-300">
                <button id="start-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xl font-bold py-4 px-10 rounded-full shadow-lg transform transition hover:-translate-y-1 hover:shadow-xl active:translate-y-0">
                    게임 시작!
                </button>
            </div>

            <!-- 클릭할 타겟 (초기에는 숨김) -->
            <div id="target" class="target-anim absolute w-16 h-16 bg-white rounded-full shadow-md flex items-center justify-center text-4xl cursor-pointer select-none hidden" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">
                🏀
            </div>
        </div>

        <!-- 결과 모달 (alert 창 대체) -->
        <div id="result-modal" class="absolute inset-0 bg-gray-900 bg-opacity-40 backdrop-blur-sm z-50 hidden flex items-center justify-center">
            <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4 text-center animate-pop-in">
                <div class="text-5xl mb-4">🎉</div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">테스트 완료!</h2>
                <p class="text-gray-600 mb-6">최종 기록: <span id="final-time" class="text-indigo-600 font-extrabold text-3xl">0.00</span>초</p>
                <p class="text-sm text-gray-500 mb-6">우리 반 최고 기록에 도전해 보세요!</p>
                
                <button id="retry-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition duration-200 shadow-md">
                    다시 도전하기
                </button>
            </div>
        </div>
    </div>

    <script>
        // DOM 요소 캐싱
        const gameBoard = document.getElementById('game-board');
        const target = document.getElementById('target');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const resultModal = document.getElementById('result-modal');
        const retryBtn = document.getElementById('retry-btn');
        const clicksDisplay = document.getElementById('clicks-display');
        const timerDisplay = document.getElementById('timer-display');
        const finalTimeDisplay = document.getElementById('final-time');

        // 게임 상태 변수
        let clicks = 0;
        let startTime = 0;
        let timerInterval = null;
        const targetClicks = 5; // 목표 클릭 횟수

        // 타겟 무작위 위치로 이동 함수
        function moveTarget() {
            // 타겟의 크기를 고려하여 보드 내에서만 이동하도록 계산
            const targetSize = 64; // w-16 h-16 is roughly 64px
            const maxX = gameBoard.clientWidth - targetSize;
            const maxY = gameBoard.clientHeight - targetSize;

            const randomX = Math.max(0, Math.floor(Math.random() * maxX));
            const randomY = Math.max(0, Math.floor(Math.random() * maxY));

            // 가운데 정렬에 사용했던 transform 제거 및 위치 할당
            target.style.transform = 'none'; 
            target.style.left = `${randomX}px`;
            target.style.top = `${randomY}px`;
        }

        // 타이머 업데이트 함수
        function updateTimer() {
            const currentTime = new Date().getTime();
            const elapsedTime = (currentTime - startTime) / 1000;
            timerDisplay.textContent = elapsedTime.toFixed(2);
        }

        // 게임 시작 함수
        function startGame() {
            // 변수 초기화
            clicks = 0;
            clicksDisplay.textContent = clicks;
            timerDisplay.textContent = "0.00";
            
            // UI 업데이트
            startScreen.classList.add('hidden');
            resultModal.classList.add('hidden');
            target.classList.remove('hidden');
            
            // 첫 번째 위치 지정
            moveTarget();
            
            // 타이머 시작
            startTime = new Date().getTime();
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 10);
        }

        // 게임 종료 함수
        function endGame() {
            clearInterval(timerInterval);
            target.classList.add('hidden');
            
            // 최종 시간 기록
            const finalTime = timerDisplay.textContent;
            finalTimeDisplay.textContent = finalTime;
            
            // 결과 모달 표시
            resultModal.classList.remove('hidden');
        }

        // 이벤트 리스너 등록
        startBtn.addEventListener('click', startGame);
        retryBtn.addEventListener('click', startGame);

        // 터치 및 마우스 클릭 이벤트 모두 처리 (모바일 호환성)
        target.addEventListener('mousedown', (e) => {
            // 기본 동작(드래그 등) 방지
            e.preventDefault(); 
            
            clicks++;
            clicksDisplay.textContent = clicks;
            
            if (clicks >= targetClicks) {
                endGame();
            } else {
                moveTarget();
            }
        });
        
        // 모바일 터치 대응
        target.addEventListener('touchstart', (e) => {
            e.preventDefault();
            
            clicks++;
            clicksDisplay.textContent = clicks;
            
            if (clicks >= targetClicks) {
                endGame();
            } else {
                moveTarget();
            }
        });
    </script>
</body>
</html>
